qampqYHACGEEEL2QfJPDwAGg8FgMOgBQAghhJB9UACgBwA1NTU1NTU9AAghhBByl0MPAGpqampqanoAEEIIIWSfQA8Aampqamrq/aUVL38IIYQQQgghhJC7n/8/yjz/u75IxK4AAAAASUVORK5CYII=';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x06060e);
const camera = new THREE.PerspectiveCamera(40, W/H, 0.01, 100);
camera.position.set(0, 0.6, 5.8);
camera.lookAt(0, 0.4, 0);

// Свет
const amb  = new THREE.AmbientLight(0x334466, 5.0);
scene.add(amb);
const key  = new THREE.DirectionalLight(0xffeedd, 6.0);
key.position.set(3,6,5); key.castShadow=true; scene.add(key);
const fill = new THREE.DirectionalLight(0x8899cc, 3.0);
fill.position.set(-5,2,3); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffffff, 3.5);
rim.position.set(0,8,-6); scene.add(rim);
const bot  = new THREE.PointLight(0x2233bb, 3.0, 12);
bot.position.set(0,-4,3); scene.add(bot);

// Текстура из base64
const loader = new THREE.TextureLoader();
const tex = loader.load(TEXTURE_B64);
tex.wrapS = THREE.RepeatWrapping;
tex.wrapT = THREE.ClampToEdgeWrapping;
tex.repeat.set(1, 1);
tex.offset.set(0, 0);

// Профиль бутылки Qazaq
const pts = [
  new THREE.Vector2(0.000,0.000),
  new THREE.Vector2(0.210,0.000),
  new THREE.Vector2(0.235,0.028),
  new THREE.Vector2(0.240,0.080),
  new THREE.Vector2(0.241,0.200),
  new THREE.Vector2(0.242,0.500),
  new THREE.Vector2(0.242,0.850),
  new THREE.Vector2(0.242,1.150),
  new THREE.Vector2(0.241,1.380),
  new THREE.Vector2(0.238,1.460),
  new THREE.Vector2(0.230,1.550),
  new THREE.Vector2(0.212,1.650),
  new THREE.Vector2(0.185,1.740),
  new THREE.Vector2(0.148,1.815),
  new THREE.Vector2(0.105,1.870),
  new THREE.Vector2(0.070,1.910),
  new THREE.Vector2(0.058,1.940),
  new THREE.Vector2(0.056,2.080),
  new THREE.Vector2(0.055,2.240),
  new THREE.Vector2(0.055,2.400),
  new THREE.Vector2(0.055,2.460),
  new THREE.Vector2(0.066,2.474),
  new THREE.Vector2(0.066,2.510),
  new THREE.Vector2(0.056,2.524),
  new THREE.Vector2(0.054,2.545),
];

const bottleGeo = new THREE.LatheGeometry(pts, 128);

// Материал с текстурой
const bottleMat = new THREE.MeshPhongMaterial({
  map: tex,
  specular: new THREE.Color(0xaabbcc),
  shininess: 120,
  transparent: true,
  opacity: 0.94,
  side: THREE.DoubleSide,
});

const bg = new THREE.Group();
bg.position.y = -1.35;
scene.add(bg);

const bottle = new THREE.Mesh(bottleGeo, bottleMat);
bottle.castShadow = true;
bg.add(bottle);

// Пробка серебряная
const silverMat = new THREE.MeshPhongMaterial({
  color:0xa8bcc8, specular:0xffffff, shininess:280
});
const capMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.058,0.064,0.21,64), silverMat);
capMesh.position.y = 2.65;
bg.add(capMesh);
const capDome = new THREE.Mesh(
  new THREE.SphereGeometry(0.058,64,32,0,Math.PI*2,0,Math.PI/2), silverMat);
capDome.position.y = 2.755;
bg.add(capDome);
for(let i=0;i<5;i++){
  const r = new THREE.Mesh(new THREE.TorusGeometry(0.063,0.0028,8,64), silverMat);
  r.position.y = 2.565+i*0.038;
  bg.add(r);
}
// Фольга
const foil = new THREE.Mesh(new THREE.CylinderGeometry(0.068,0.060,0.052,64), silverMat);
foil.position.y = 2.524;
bg.add(foil);

// Пол
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(14,14),
  new THREE.MeshPhongMaterial({color:0x040410, specular:0x1122aa, shininess:150})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -1.52;
floor.receiveShadow = true;
scene.add(floor);

// Свечение пола
const glow = new THREE.Mesh(
  new THREE.PlaneGeometry(2.2,2.2),
  new THREE.MeshBasicMaterial({color:0x1133bb, transparent:true, opacity:0.07})
);
glow.rotation.x = -Math.PI/2;
glow.position.y = -1.505;
scene.add(glow);

// Частицы
const pG = new THREE.BufferGeometry();
const pN=70, pA=new Float32Array(pN*3);
for(let i=0;i<pN;i++){pA[i*3]=(Math.random()-0.5)*8;pA[i*3+1]=(Math.random()-0.5)*8;pA[i*3+2]=(Math.random()-0.5)*4-1;}
pG.setAttribute('position',new THREE.BufferAttribute(pA,3));
scene.add(new THREE.Points(pG,new THREE.PointsMaterial({color:0x3355bb,size:0.02,transparent:true,opacity:0.4})));

// Управление
let rotX=0,rotY=0.5,tRX=0,tRY=0.5,drag=false,px=0,py=0,auto=true,ltd=0,aT=null,zoom=5.8;
const cv=document.getElementById('c');
cv.addEventListener('mousedown',e=>{drag=true;px=e.clientX;py=e.clientY;auto=false;clearTimeout(aT);});
cv.addEventListener('mousemove',e=>{if(!drag)return;tRY+=(e.clientX-px)*0.011;tRX+=(e.clientY-py)*0.008;tRX=Math.max(-1,Math.min(1,tRX));px=e.clientX;py=e.clientY;});
cv.addEventListener('mouseup',()=>{drag=false;aT=setTimeout(()=>{auto=true;},3000);});
cv.addEventListener('wheel',e=>{zoom=Math.max(3,Math.min(8,zoom+e.deltaY*0.004));});
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===1){drag=true;px=e.touches[0].clientX;py=e.touches[0].clientY;auto=false;clearTimeout(aT);}
  else if(e.touches.length===2){ltd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
  e.preventDefault();
},{passive:false});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&drag){tRY+=(e.touches[0].clientX-px)*0.013;tRX+=(e.touches[0].clientY-py)*0.010;tRX=Math.max(-1,Math.min(1,tRX));px=e.touches[0].clientX;py=e.touches[0].clientY;}
  else if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom=Math.max(3,Math.min(8,zoom+(ltd-d)*0.025));ltd=d;}
  e.preventDefault();
},{passive:false});
cv.addEventListener('touchend',()=>{drag=false;aT=setTimeout(()=>{auto=true;},3000);});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  if(auto) tRY+=0.006;
  rotX+=(tRX-rotX)*0.08; rotY+=(tRY-rotY)*0.08;
  bg.rotation.x=rotX; bg.rotation.y=rotY;
  bg.position.y=-1.35+Math.sin(t*0.75)*0.025;
  camera.position.z+=(zoom-camera.position.z)*0.07;
  glow.material.opacity=0.05+Math.sin(t*1.2)*0.025;
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  const w=innerWidth,h=innerHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);
});
