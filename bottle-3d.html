scene.add(new THREE.Points(pG,new THREE.PointsMaterial({color:0x3355bb,size:0.02,transparent:true,opacity:0.35})));

// Управление
let rX=0,rY=0.5,tX=0,tY=0.5,drag=false,px=0,py=0,auto=true,ltd=0,aT=null,zoom=5.5;
const cv=document.getElementById('c');
cv.addEventListener('mousedown',e=>{drag=true;px=e.clientX;py=e.clientY;auto=false;clearTimeout(aT);});
cv.addEventListener('mousemove',e=>{if(!drag)return;tY+=(e.clientX-px)*0.011;tX+=(e.clientY-py)*0.008;tX=Math.max(-1,Math.min(1,tX));px=e.clientX;py=e.clientY;});
cv.addEventListener('mouseup',()=>{drag=false;aT=setTimeout(()=>{auto=true;},3000);});
cv.addEventListener('wheel',e=>{zoom=Math.max(3,Math.min(8,zoom+e.deltaY*0.004));});
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===1){drag=true;px=e.touches[0].clientX;py=e.touches[0].clientY;auto=false;clearTimeout(aT);}
  else if(e.touches.length===2) ltd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  e.preventDefault();
},{passive:false});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&drag){tY+=(e.touches[0].clientX-px)*0.013;tX+=(e.touches[0].clientY-py)*0.010;tX=Math.max(-1,Math.min(1,tX));px=e.touches[0].clientX;py=e.touches[0].clientY;}
  else if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom=Math.max(3,Math.min(8,zoom+(ltd-d)*0.025));ltd=d;}
  e.preventDefault();
},{passive:false});
cv.addEventListener('touchend',()=>{drag=false;aT=setTimeout(()=>{auto=true;},3000);});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  if(auto) tY+=0.006;
  rX+=(tX-rX)*0.08; rY+=(tY-rY)*0.08;
  bg.rotation.x=rX; bg.rotation.y=rY;
  bg.position.y=-1.35+Math.sin(t*0.75)*0.025;
  camera.position.z+=(zoom-camera.position.z)*0.07;
  glow.material.opacity=0.05+Math.sin(t*1.2)*0.025;
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
